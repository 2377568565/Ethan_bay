name: ask-probe
# 临时诊断：从 GitHub 服务器检查提问区连接页（查完会删掉）
on:
  push:
    paths: ['.github/workflows/ask-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: notice page text
        run: |
          H=https://wenda-d8gqka1o3902489eb-1492434734.tcloudbaseapp.com
          curl -sS -D headers.txt -A 'Mozilla/5.0 Chrome/129.0' -H 'Sec-Fetch-Mode: navigate' "$H/ask-bridge.html" -o notice.html
          cat headers.txt
          python3 - <<'PY'
          import re,html
          s=open('notice.html',encoding='utf-8',errors='replace').read()
          print('LEN',len(s))
          body=re.sub(r'(?s)<style.*?</style>','',s)
          scripts=re.findall(r'(?s)<script[^>]*>(.*?)</script>',body)
          body=re.sub(r'(?s)<script.*?</script>','',body)
          print('TEXT:',re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',body))).strip()[:1500])
          print('LINKS:',re.findall(r'<a[^>]*>',body)[:10])
          for sc in scripts: print('SCRIPT:',sc.strip()[:1500])
          PY
