name: ask-probe
# 临时：上线后从 GitHub 服务器打开真实网站检查一遍（查完会删掉）
on:
  push:
    paths: ['.github/workflows/ask-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://2377568565.github.io/Ethan_bay/
    steps:
      - name: 等网站更新
        run: |
          for i in $(seq 1 60); do
            if curl -sS -m 20 "$BASE?nocache=$i" | grep -q 'data-rsettings'; then echo "已更新（第 $i 次）"; exit 0; fi
            sleep 10
          done
          echo '网站还没更新'; exit 1
      - name: 文件与服务
        run: |
          html=$(curl -sS -m 20 "$BASE")
          for f in $(echo "$html" | grep -o 'site/[0-9a-f]*\.\(woff2\|json\)' | sort -u); do
            printf '%s ' "$f"; curl -sS -m 30 -o /dev/null -w '%{http_code} %{size_download}\n' "$BASE$f"
          done
          printf 'data/ask.json '; curl -sS -m 20 "${BASE}data/ask.json" | python3 -c "import sys,json;d=json.load(sys.stdin);print('问题',len(d.get('questions',[])),'回复',len(d.get('replies',[])))"
          printf 'ntfy '; curl -sS -m 20 -D - -o /dev/null -H "Origin: https://2377568565.github.io" "https://ntfy.sh/q4ask-c656a4ca18696d0b/json?poll=1&since=10m" | grep -i '^HTTP\|access-control-allow-origin'
      - name: 用浏览器打开
        run: |
          npm i --no-save --silent playwright-core@1.47.2
          cat > probe.js <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const b=await chromium.launch({executablePath:'/usr/bin/google-chrome'});const errs=[];
            for(const vp of [{width:390,height:844,isMobile:true,hasTouch:true},{width:1280,height:900}]){
              const c=await b.newContext({viewport:{width:vp.width,height:vp.height},isMobile:!!vp.isMobile,hasTouch:!!vp.hasTouch,timezoneId:'Asia/Shanghai',locale:'zh-CN'});
              const p=await c.newPage();
              p.on('pageerror',e=>errs.push(vp.width+' pageerror: '+e.message));
              p.on('console',m=>{if(m.type()==='error'&&!/busuanzi|pconline|sohu|Failed to load resource/.test(m.text()))errs.push(vp.width+' console: '+m.text().slice(0,160));});
              await p.goto(process.env.BASE,{waitUntil:'load'});await p.waitForTimeout(4000);
              const r=await p.evaluate(()=>({
                今天:(document.querySelector('#welcome .wdate')||{}).textContent,
                本周共读:!!document.querySelector('.wtogether:not([hidden])'),
                阅读工具:!!document.querySelector('#welcome .wtools [data-rsettings]'),
                打卡框:document.querySelectorAll('.ckin').length,
                讨论区:document.querySelectorAll('.dsc').length,
                字体失败:[...document.fonts].filter(f=>f.status==='error').length,
                横向溢出:document.documentElement.scrollWidth>innerWidth+1}));
              console.log(vp.width,JSON.stringify(r));
              await p.goto(process.env.BASE+'#ask');await p.reload({waitUntil:'load'});
              for(let i=0;i<30;i++){await p.waitForTimeout(1000);if(!/正在连接/.test(await p.textContent('#ask .ask-items')))break;}
              console.log(vp.width,'提问区:',(await p.textContent('#ask .ask-items')).replace(/\s+/g,' ').slice(0,160));
              console.log(vp.width,'+1 按钮:',await p.locator('#ask [data-vote]').count());
              await c.close();
            }
            console.log('错误:',errs.length?errs:'无');await b.close();if(errs.length)process.exit(1);
          })();
          JS
          node probe.js
