name: ask-probe
# 临时：上线后从 GitHub 服务器检查音乐栏目（查完会删掉）
on:
  push:
    paths: ['.github/workflows/ask-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://2377568565.github.io/Ethan_bay/
    steps:
      - name: 等网站更新
        run: |
          for i in $(seq 1 60); do
            if curl -sS -m 20 "$BASE?nocache=$i" | grep -q 'class="msong"'; then echo "已更新（第 $i 次）"; exit 0; fi
            sleep 10
          done
          echo '网站还没更新'; exit 1
      - name: 音乐文件
        run: |
          for f in music/be-thou-my-vision.mp3 music/awesome-god.mp3; do
            printf '%s ' "$f"; curl -sS -m 30 -o /dev/null -w '%{http_code} %{content_type} %{size_download}\n' "$BASE$f"
          done
          printf '分段请求 '; curl -sS -m 30 -r 1000-1999 -o /dev/null -w '%{http_code} %{size_download}\n' "${BASE}music/awesome-god.mp3"
      - name: 模拟微信播放
        run: |
          npm i --no-save --silent playwright-core@1.47.2
          cat > probe.js <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const b=await chromium.launch({executablePath:'/usr/bin/google-chrome'});const errs=[];
            const c=await b.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,timezoneId:'Asia/Shanghai',locale:'zh-CN',
              userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 MicroMessenger/8.0.50(0x18003231) NetType/WIFI Language/zh_CN'});
            const p=await c.newPage();
            p.on('pageerror',e=>errs.push('pageerror: '+e.message));
            p.on('console',m=>{if(m.type()==='error'&&!/busuanzi|pconline|sohu|Failed to load resource/.test(m.text()))errs.push('console: '+m.text().slice(0,160));});
            await p.goto(process.env.BASE+'?today=2026-10-01',{waitUntil:'load'});await p.waitForTimeout(3500);
            await p.tap('#welcome a.wbtn.music');await p.waitForTimeout(1500);
            console.log('曲目:',(await p.$$eval('.msong .ms-t',a=>a.map(x=>x.textContent))).join(' / '));
            await p.locator('.msong [data-mplay]').first().tap();await p.waitForTimeout(6000);
            const st=()=>p.evaluate(()=>({playing:!!document.querySelector('.msong.playing'),tm:(document.querySelector('.msong.cur .ms-tm')||{}).textContent,mini:!document.querySelector('.mplayer').hidden}));
            console.log('播放 6 秒:',JSON.stringify(await st()));
            await p.evaluate(()=>{location.hash='#l1-yw-thu';});await p.waitForTimeout(4000);
            console.log('去读原文:',JSON.stringify(await st()));
            console.log('错误:',errs.length?errs:'无');await b.close();if(errs.length)process.exit(1);
          })();
          JS
          node probe.js
