name: ask-probe
# 临时：上线后从 GitHub 服务器打开真实网站检查一遍（查完会删掉）
on:
  push:
    paths: ['.github/workflows/ask-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://2377568565.github.io/Ethan_bay/
    steps:
      - name: 等网站更新
        run: |
          for i in $(seq 1 60); do
            if curl -sS -m 20 "$BASE?nocache=$i" | grep -q 'id="audiocfg"'; then echo "已更新（第 $i 次）"; exit 0; fi
            sleep 10
          done
          echo '网站还没更新'; exit 1
      - name: 声音文件
        run: |
          for f in tts-try.html audio/try/index.json audio/try/cv3-f.mp3 audio/try/kk-m.mp3 tools/q4/tts/script.json; do
            printf '%s ' "$f"; curl -sS -m 30 -o /dev/null -w '%{http_code} %{content_type} %{size_download}\n' "$BASE$f"
          done
          printf '分段请求 '; curl -sS -m 30 -r 1000-1999 -o /dev/null -w '%{http_code} %{size_download}\n' "${BASE}audio/try/cv3-f.mp3"
      - name: 用浏览器打开
        run: |
          npm i --no-save --silent playwright-core@1.47.2
          cat > probe.js <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const b=await chromium.launch({executablePath:'/usr/bin/google-chrome'});const errs=[];
            const c=await b.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,timezoneId:'Asia/Shanghai',locale:'zh-CN',
              userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 MicroMessenger/8.0.50(0x18003231) NetType/WIFI Language/zh_CN'});
            const p=await c.newPage();
            p.on('pageerror',e=>errs.push('pageerror: '+e.message));
            p.on('console',m=>{if(m.type()==='error'&&!/busuanzi|pconline|sohu|Failed to load resource/.test(m.text()))errs.push('console: '+m.text().slice(0,160));});
            await p.goto(process.env.BASE+'?today=2026-10-01',{waitUntil:'load'});await p.waitForTimeout(3500);
            console.log('进入今日学课 →',await p.getAttribute('#wgo','href'));
            await p.tap('#wgo');await p.waitForTimeout(2500);
            console.log(JSON.stringify(await p.evaluate(()=>({hash:location.hash,打卡框:document.querySelectorAll('.ckin').length,原文里有打卡:!!document.querySelector('#l1-yw-thu .ckin'),
              主页按钮:getComputedStyle(document.querySelector('.fab')).opacity,确认框:!!document.getElementById('hconf'),朗读按钮:document.querySelectorAll('.ttsbtn').length}))));
            await p.goto(process.env.BASE+'tts-try.html',{waitUntil:'load'});await p.waitForTimeout(2500);
            console.log('试听页:',(await p.$$eval('.card h2',a=>a.map(x=>x.textContent))).join(' / '));
            const ok=await p.evaluate(()=>new Promise(r=>{const a=document.querySelector('audio');a.preload='auto';a.addEventListener('loadedmetadata',()=>r('时长 '+Math.round(a.duration)+' 秒'));a.addEventListener('error',()=>r('加载失败'));a.load();setTimeout(()=>r('超时'),15000);}));
            console.log('第一个样本:',ok);
            console.log('错误:',errs.length?errs:'无');await b.close();if(errs.length)process.exit(1);
          })();
          JS
          node probe.js
