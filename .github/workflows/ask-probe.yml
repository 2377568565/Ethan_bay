name: ask-probe
# 临时：检查经纬度换地名的两个免费服务（查完会删掉）
on:
  push:
    paths: ['.github/workflows/ask-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: reverse geocode
        run: |
          for p in "杭州 30.27 120.16" "上海 31.23 121.47" "北京 39.90 116.40" "郑州 34.75 113.62" "乌鲁木齐 43.83 87.62" "新北板桥 25.01 121.46" "台北 25.03 121.56" "高雄 22.63 120.30" "香港 22.32 114.17" "洛杉矶 34.05 -118.24"; do
            set -- $p; echo "=== $1"
            curl -sS -m 15 -H 'Origin: https://2377568565.github.io' "https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=$2&longitude=$3&localityLanguage=zh" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          print('BDC', d.get('countryCode'), '|', d.get('countryName'), '|', d.get('principalSubdivision'), '|', d.get('city'), '|', d.get('locality'))
          print('    admin:', [(a.get('adminLevel'), a.get('name')) for a in (d.get('localityInfo') or {}).get('administrative', [])])"
            curl -sS -m 15 -A 'Ethan_bay-probe' "https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&accept-language=zh-CN,zh&lat=$2&lon=$3" | python3 -c "
          import sys,json
          d=json.load(sys.stdin); a=d.get('address',{})
          print('OSM', a.get('country_code'), '|', a.get('country'), '|', a.get('state'), '|', a.get('province'), '|', a.get('city'), '|', a.get('county'), '|', a.get('town'))"
            sleep 1.2
          done
          echo "=== CORS headers"; curl -sS -D - -o /dev/null -H 'Origin: https://2377568565.github.io' "https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=30.27&longitude=120.16&localityLanguage=zh" | grep -i 'access-control'
          curl -sS -D - -o /dev/null -H 'Origin: https://2377568565.github.io' "https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&lat=30.27&lon=120.16" | grep -i 'access-control'
