name: ask-probe
# 临时：上线后从 GitHub 服务器打开真实网站检查账号入口与朗读（查完会删掉；不注册测试账号）
on:
  push:
    paths: ['.github/workflows/ask-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://2377568565.github.io/Ethan_bay/
    steps:
      - name: 等网站更新
        run: |
          for i in $(seq 1 60); do
            if curl -sS -m 20 "$BASE?nocache=$i" | grep -q 'data-acct'; then echo "已更新（第 $i 次）"; exit 0; fi
            sleep 10
          done
          echo '网站还没更新'; exit 1
      - name: 模拟微信打开
        run: |
          npm i --no-save --silent playwright-core@1.47.2
          cat > probe.js <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const b=await chromium.launch({executablePath:'/usr/bin/google-chrome'});const errs=[];
            const c=await b.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,timezoneId:'Asia/Shanghai',locale:'zh-CN',
              userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 MicroMessenger/8.0.50(0x18003231) NetType/WIFI Language/zh_CN'});
            await c.addInitScript(()=>{Object.defineProperty(window,'speechSynthesis',{value:undefined});window.SpeechSynthesisUtterance=undefined;});
            const p=await c.newPage();
            p.on('pageerror',e=>errs.push('pageerror: '+e.message));
            p.on('console',m=>{if(m.type()==='error'&&!/busuanzi|pconline|sohu|Failed to load resource/.test(m.text()))errs.push('console: '+m.text().slice(0,160));});
            await p.goto(process.env.BASE+'?today=2026-10-01',{waitUntil:'load'});await p.waitForTimeout(4000);
            console.log('账号按钮:',await p.textContent('#welcome [data-acct]'));
            await p.tap('#welcome [data-acct]');await p.waitForTimeout(600);
            console.log('面板:',(await p.textContent('.acctsheet .rs-body')).replace(/\s+/g,' ').slice(0,80));
            await p.tap('.acctsheet [data-actab="up"]');await p.waitForTimeout(300);
            console.log('注册页有确认密码:',await p.locator('.acctsheet .ac-p2').count());
            await p.fill('.acctsheet .ac-u','这个账号一定不存在');await p.tap('.acctsheet [data-actab="in"]');await p.waitForTimeout(200);
            await p.fill('.acctsheet .ac-p','probe-only-123');await p.tap('.acctsheet .ac-go');
            for(let i=0;i<30;i++){await p.waitForTimeout(500);const m=await p.textContent('.acctsheet .ac-msg');if(!/正在/.test(m))break;}
            console.log('登录一个不存在的账号:',await p.textContent('.acctsheet .ac-msg'));
            await p.tap('.acctsheet .rs-x');await p.waitForTimeout(400);await p.tap('#wgo');await p.waitForTimeout(2500);
            console.log('听朗读按钮:',await p.evaluate(()=>document.querySelectorAll('.ttsbtn.rec').length));
            console.log('错误:',errs.length?errs:'无');await b.close();if(errs.length)process.exit(1);
          })();
          JS
          node probe.js
