name: ask-probe
# 临时诊断（查完会删掉）
on:
  push:
    paths: ['.github/workflows/ask-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ntfy poll timing
        run: |
          T=https://ntfy.sh/q4ask-c656a4ca18696d0b-probe
          NOW=$(date +%s)
          curl -sS -d 'second message' $T >/dev/null
          for w in 1 3 6; do sleep $w; echo "== after +$w s since=all:"; curl -sS "$T/json?poll=1&since=all" | cut -c1-120; done
          echo "== since=unix-60"; curl -sS "$T/json?poll=1&since=$((NOW-60))" | cut -c1-120
          echo "== since=12h"; curl -sS "$T/json?poll=1&since=12h" | wc -l
