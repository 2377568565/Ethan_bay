name: ask-probe
# 临时：上线后检查新歌（OGG）和格式对比页（查完会删掉）
on:
  push:
    paths: ['.github/workflows/ask-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: https://2377568565.github.io/Ethan_bay/
    steps:
      - name: 等网站更新
        run: |
          for i in $(seq 1 80); do
            if curl -sS -m 30 "${BASE}music/list.json?nocache=$i" | grep -q 'm8755065e.ogg'; then echo "已更新（第 $i 次）"; exit 0; fi
            sleep 10
          done
          echo '网站还没更新'; exit 1
      - name: 文件
        run: |
          for f in music/m8755065e.ogg music/m8755065e.m4a audio/music-try/rdm-ogg.ogg audio/music-try/btmv-orig.mp3 audio/music-try/btmv-ogg.ogg audio/music-try/btmv-ogg-aac.m4a audio/music-try/ag-ogg.ogg audio/music-try/ag-orig.mp3 audio/music-try/ag-ogg-aac.m4a audio/music-try/rdm-ogg-aac.m4a; do
            printf '%-36s ' "$f"; curl -sS -m 30 -o /dev/null -I -w '%{http_code} %{content_type}\n' "$BASE$f"
          done
      - name: 模拟微信
        run: |
          npm i --no-save --silent playwright-core@1.47.2
          cat > probe.js <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const b=await chromium.launch({executablePath:'/usr/bin/google-chrome'});const errs=[];
            const c=await b.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,timezoneId:'Asia/Shanghai',locale:'zh-CN',
              userAgent:'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Mobile Safari/537.36 MicroMessenger/8.0.50 NetType/WIFI Language/zh_CN'});
            const p=await c.newPage();
            p.on('pageerror',e=>errs.push('pageerror: '+e.message));
            p.on('console',m=>{if(m.type()==='error'&&!/pconline|sohu|Failed to load resource/.test(m.text()))errs.push('console: '+m.text().slice(0,160));});
            await p.goto(process.env.BASE+'#music',{waitUntil:'load'});await p.waitForTimeout(4000);
            const id='#music-m8755065e';await p.locator(id).scrollIntoViewIfNeeded();
            const t0=Date.now();await p.locator(id+' [data-mplay]').tap();
            let s;for(let i=0;i<60;i++){await p.waitForTimeout(250);s=await p.evaluate(i=>({tm:document.querySelector(i+' .ms-tm').textContent,cur:document.querySelector('.msong.cur .ms-t')&&document.querySelector('.msong.cur .ms-t').textContent}),id);if(/^0:0[2-9]/.test(s.tm))break;}
            console.log('新歌（OGG）:',((Date.now()-t0)/1000).toFixed(1),'秒播到',JSON.stringify(s));
            const q=await c.newPage();q.on('pageerror',e=>errs.push('try: '+e.message));
            await q.goto(process.env.BASE+'music-try.html',{waitUntil:'load'});await q.waitForTimeout(1000);
            console.log('对比页播放器:',await q.locator('audio').count(),'| OGG 警告:',await q.locator('#warn').isVisible());
            const r=await q.evaluate(async()=>{const out=[];for(const a of document.querySelectorAll('audio')){a.preload='metadata';a.load();await new Promise(ok=>{a.onloadedmetadata=ok;a.onerror=ok;setTimeout(ok,15000);});out.push(a.getAttribute('src').split('/').pop()+'='+(a.error?'错误'+a.error.code:Math.round(a.duration)+'秒'));}return out;});
            console.log(r.join('  '));
            console.log('错误:',errs.length?errs:'无');await b.close();if(errs.length)process.exit(1);
          })();
          JS
          node probe.js
