name: ask-probe
# 临时诊断：从 GitHub 服务器检查提问区连接页（查完会删掉）
on:
  push:
    paths: ['.github/workflows/ask-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: notice page
        run: |
          H=https://wenda-d8gqka1o3902489eb-1492434734.tcloudbaseapp.com
          CH='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36'
          nav(){ curl -sS -A "$CH" -H 'Accept: text/html' -H 'Sec-Fetch-Dest: document' -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Site: none' "$@"; }
          echo "== notice text"; nav "$H/ask-bridge.html" | sed -e 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 1500; echo
          echo "== which header triggers it"
          for v in "Sec-Fetch-Mode: navigate" "Sec-Fetch-Dest: document" "Sec-Fetch-Dest: iframe" "Sec-Fetch-Site: none" "Sec-Fetch-Site: cross-site" "Upgrade-Insecure-Requests: 1" "Accept: text/html"; do
            printf '%-32s ' "$v"; curl -sS -o /dev/null -w '%{http_code}\n' -A "$CH" -H "$v" "$H/ask-bridge.html"; done
          echo "== root"; nav -o /dev/null -w '%{http_code}\n' "$H/"
          echo "== geo hint"; curl -sS https://ipinfo.io/country || true
