name: ask-probe
# 临时：上线后检查访问人次、本周共读、学课目录、音乐（查完会删掉）
on:
  push:
    paths: ['.github/workflows/ask-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: https://2377568565.github.io/Ethan_bay/
    steps:
      - name: 等网站更新
        run: |
          for i in $(seq 1 80); do
            if curl -sS -m 30 "$BASE?nocache=$i" | grep -q 'class="wvisits" data-base'; then echo "已更新（第 $i 次）"; exit 0; fi
            sleep 10
          done
          echo '网站还没更新'; exit 1
      - name: 模拟微信
        run: |
          npm i --no-save --silent playwright-core@1.47.2
          cat > probe.js <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const b=await chromium.launch({executablePath:'/usr/bin/google-chrome'});const errs=[];
            const c=await b.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,timezoneId:'Asia/Shanghai',locale:'zh-CN',
              userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 MicroMessenger/8.0.50(0x18003231) NetType/WIFI Language/zh_CN'});
            const p=await c.newPage();
            p.on('pageerror',e=>errs.push('pageerror: '+e.message));
            p.on('console',m=>{if(m.type()==='error'&&!/pconline|sohu|Failed to load resource/.test(m.text()))errs.push('console: '+m.text().slice(0,160));});
            await p.goto(process.env.BASE,{waitUntil:'load'});await p.waitForTimeout(8000);
            console.log(await p.evaluate(()=>({访问:document.querySelector('#welcome .wvisits').textContent.trim(),本周共读:document.querySelector('#welcome .wt-msg').textContent,
              格子:[...document.querySelectorAll('#welcome .wt-d')].map(a=>a.textContent).join(' '),按钮:[...document.querySelectorAll('#welcome .wbtns a')].map(a=>a.textContent.trim()).join(' | '),
              还有不蒜子:!!document.querySelector('script[src*="busuanzi"]')})));
            await p.tap('#welcome a.wbtn.music');await p.waitForTimeout(2000);
            await p.locator('[data-mall]').tap();await p.waitForTimeout(6000);
            console.log('音乐:',await p.evaluate(()=>(document.querySelector('.msong.cur .ms-t')||{}).textContent+' '+(document.querySelector('.msong.cur .ms-tm')||{}).textContent));
            await p.locator('.mplayer .mp-next').tap();await p.waitForTimeout(4000);
            console.log('下一首:',await p.evaluate(()=>(document.querySelector('.msong.cur .ms-t')||{}).textContent+' '+(document.querySelector('.msong.cur .ms-tm')||{}).textContent));
            await p.evaluate(()=>{location.hash='#l1-yw-thu';});await p.waitForTimeout(2000);
            console.log('原文页打卡那一行:',JSON.stringify(await p.textContent('#l1-yw-thu .ckin .ck-n')),'| 目录按钮:',await p.textContent('.lessonbar a.btn.ghost'));
            console.log('错误:',errs.length?errs:'无');await b.close();if(errs.length)process.exit(1);
          })();
          JS
          node probe.js
