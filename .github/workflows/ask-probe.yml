name: ask-probe
# 临时：上线后从 GitHub 服务器检查 82 首音乐（查完会删掉）
on:
  push:
    paths: ['.github/workflows/ask-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: https://2377568565.github.io/Ethan_bay/
    steps:
      - name: 等网站更新
        run: |
          for i in $(seq 1 80); do
            n=$(curl -sS -m 30 "${BASE}music/list.json?nocache=$i" | python3 -c "import json,sys;print(len(json.load(sys.stdin)['songs']))" 2>/dev/null || echo 0)
            if [ "$n" = "82" ] && curl -sS -m 30 "$BASE?nocache=$i" | grep -q 'mp-prev'; then echo "已更新（第 $i 次）：$n 首"; exit 0; fi
            sleep 10
          done
          echo '网站还没更新'; exit 1
      - name: 音乐文件
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = os.environ['BASE']
          songs = json.load(urllib.request.urlopen(base + 'music/list.json?x=1'))['songs']
          bad = []
          for s in songs:
              r = urllib.request.Request(base + 'music/' + s['file'], method='HEAD')
              try:
                  with urllib.request.urlopen(r, timeout=30) as f:
                      if f.status != 200 or 'audio' not in f.headers.get('Content-Type', ''):
                          bad.append((s['file'], f.status, f.headers.get('Content-Type')))
              except Exception as e:
                  bad.append((s['file'], str(e)))
          print(f'{len(songs)} 首，打不开的：{bad or "无"}')
          PY
          printf '分段请求 '; curl -sS -m 30 -r 1000-1999 -o /dev/null -w '%{http_code} %{size_download}\n' "${BASE}music/m82242908.mp3"
      - name: 模拟微信播放
        run: |
          npm i --no-save --silent playwright-core@1.47.2
          cat > probe.js <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const b=await chromium.launch({executablePath:'/usr/bin/google-chrome'});const errs=[];
            const c=await b.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,timezoneId:'Asia/Shanghai',locale:'zh-CN',
              userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 MicroMessenger/8.0.50(0x18003231) NetType/WIFI Language/zh_CN'});
            const p=await c.newPage();
            p.on('pageerror',e=>errs.push('pageerror: '+e.message));
            p.on('console',m=>{if(m.type()==='error'&&!/busuanzi|pconline|sohu|Failed to load resource/.test(m.text()))errs.push('console: '+m.text().slice(0,160));});
            await p.goto(process.env.BASE+'?today=2026-10-01',{waitUntil:'load'});await p.waitForTimeout(3500);
            await p.tap('#welcome a.wbtn.music');await p.waitForTimeout(2000);
            console.log(await p.textContent('.ms-n'),'| 前三首:',(await p.$$eval('.msong',a=>a.slice(0,3).map(x=>x.querySelector('.ms-t').textContent+'/'+x.querySelector('.ms-s').textContent))).join('；'));
            await p.fill('.ms-q','恩友');await p.waitForTimeout(400);console.log('搜“恩友”:',(await p.$$eval('.msong .ms-t',a=>a.map(x=>x.textContent))).join('、'));
            await p.fill('.ms-q','');await p.waitForTimeout(300);
            await p.locator('[data-mall]').tap();await p.waitForTimeout(6000);
            const st=()=>p.evaluate(()=>({cur:(document.querySelector('.msong.cur .ms-t')||{}).textContent,playing:!!document.querySelector('.msong.playing'),tm:(document.querySelector('.msong.cur .ms-tm')||{}).textContent,mini:document.querySelector('.mplayer').hidden?'隐藏':document.querySelector('.mplayer .mp-t').textContent+' | '+document.querySelector('.mplayer .mp-s').textContent}));
            console.log('全部播放 6 秒:',JSON.stringify(await st()));
            await p.locator('.mplayer .mp-next').tap();await p.waitForTimeout(5000);console.log('下一首:',JSON.stringify(await st()));
            await p.evaluate(()=>{location.hash='#l1-yw-thu';});await p.waitForTimeout(3000);
            await p.locator('.mplayer .mp-prev').tap();await p.waitForTimeout(800);await p.locator('.mplayer .mp-prev').tap();await p.waitForTimeout(5000);
            console.log('读原文时按上一首:',JSON.stringify(await st()));
            console.log('错误:',errs.length?errs:'无');await b.close();if(errs.length)process.exit(1);
          })();
          JS
          node probe.js
