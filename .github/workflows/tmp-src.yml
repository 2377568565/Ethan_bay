name: tmp-src
# 临时：下载《耶稣是人还是神？》新增章节要核对的原始资料，打印到日志（查完会删掉）
on:
  push:
    paths: ['.github/workflows/tmp-src.yml', 'tools/q4/tmp_src.py']
permissions:
  contents: read
  checks: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pypdf requests
      - run: python3 tools/q4/tmp_src.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
