name: tmp-src
# 临时：核对补充问答页新增资料的网址和原文（查完会删掉）
on:
  push:
    paths: ['.github/workflows/tmp-src.yml', 'tools/q4/tmp_src.py']
permissions:
  contents: read
  checks: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests pypdf
      - run: python3 tools/q4/tmp_src.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
