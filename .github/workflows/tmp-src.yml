name: tmp-src
# 临时：在 GitHub 上打开容器里打不开的网页/PDF，把关键句存进“检查结果”（check run）供核对。查完删除本文件和 tools/q4/tmp_src.py。
on:
  push:
    branches: [claude/adventist-lesson-analysis-dhqrxg]
    paths: ['.github/workflows/tmp-src.yml', 'tools/q4/tmp_src.py']
permissions:
  contents: write
  checks: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests pysword
      - run: python3 tools/q4/tmp_src.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/q4/bdata
          git commit -m "圣经第二期原始数据：BSB 小标题与诗行、和合本 Strong 对应（临时任务下载）"
          for i in 1 2 3 4; do git pull --rebase origin claude/adventist-lesson-analysis-dhqrxg && git push origin HEAD:claude/adventist-lesson-analysis-dhqrxg && break; sleep 10; done
