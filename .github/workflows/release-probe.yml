name: release-probe
# 临时：检查草稿 Release 附件的文件名处理和收歌流程，跑完删掉
on:
  push:
    branches: [claude/adventist-lesson-analysis-dhqrxg]
    paths: ['.github/workflows/release-probe.yml']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: probe-tmp-music
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: 建草稿并上传
        run: |
          mkdir -p /tmp/src && cd /tmp/src
          ffmpeg -v error -f lavfi -i sine=f=440:d=6 "奇异恩典.mp3"
          ffmpeg -v error -f lavfi -i sine=f=330:d=7 "主祷文.mp3"
          ffmpeg -v error -f lavfi -i sine=f=550:d=8 "Be Thou My Vision.mp3"
          ffmpeg -v error -f lavfi -i sine=f=660:d=9 -c:a aac "你真伟大 How Great Thou Art (Official Lyric Video).m4a"
          ffmpeg -v error -f lavfi -i sine=f=220:d=10 -metadata title="耶和华祝福满满" -metadata artist="赞美之泉" "track01.mp3"
          ffmpeg -v error -f lavfi -i sine=f=770:d=11 "奇异恩典 (Live).mp3"
          ffmpeg -v error -f lavfi -i sine=f=880:d=12 "我心旋律.flac"
          ls -la
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          tok, repo, tag = os.environ['GITHUB_TOKEN'], os.environ['GITHUB_REPOSITORY'], os.environ['TAG']
          H = {'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json', 'User-Agent': 'probe'}
          def call(url, data=None, method=None, ctype='application/json'):
              h = dict(H); h['Content-Type'] = ctype
              r = urllib.request.Request(url, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(r) as f: return f.status, json.loads(f.read() or b'null')
              except urllib.error.HTTPError as e: return e.code, e.read().decode()[:300]
          st, rel = call(f'https://api.github.com/repos/{repo}/releases', json.dumps({'tag_name': tag, 'name': tag, 'draft': True, 'body': '临时测试，马上删除'}).encode())
          print('create', st, rel.get('id') if isinstance(rel, dict) else rel)
          rid = rel['id']
          for n in sorted(os.listdir('.')):
              q = urllib.parse.urlencode({'name': n})
              st, a = call(f'https://uploads.github.com/repos/{repo}/releases/{rid}/assets?{q}', open(n, 'rb').read(), 'POST', 'application/octet-stream')
              print('upload', repr(n), st, (a.get('name'), a.get('label')) if isinstance(a, dict) else a)
          st, al = call(f'https://api.github.com/repos/{repo}/releases/{rid}/assets')
          for a in al: print('asset', repr(a['name']), repr(a['label']), a['size'])
          PY
      - name: 收歌
        run: |
          python3 tools/q4/music_import.py --release "$TAG" --music /tmp/m
          cat /tmp/m/list.json; ls -la /tmp/m
          echo '--- 再跑一次（应该没有新的）'
          python3 tools/q4/music_import.py --release "$TAG" --music /tmp/m
      - name: 删草稿
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          tok, repo, tag = os.environ['GITHUB_TOKEN'], os.environ['GITHUB_REPOSITORY'], os.environ['TAG']
          H = {'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json', 'User-Agent': 'probe'}
          rels = json.load(urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/releases?per_page=100', headers=H)))
          for r in rels:
              if r['tag_name'] == tag:
                  urllib.request.urlopen(urllib.request.Request(f"https://api.github.com/repos/{repo}/releases/{r['id']}", headers=H, method='DELETE'))
                  print('deleted', r['id'])
          print('releases now', [(r['tag_name'], r['draft']) for r in json.load(urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/releases?per_page=100', headers=H)))])
          PY
